version: 2.1

jobs:
  build-and-deploy:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - run:
          name: Build Docker image
          command: |
            docker build \
              --build-arg REACT_APP_API_URL=${REACT_APP_API_URL} \
              --build-arg REACT_APP_VIDEOSOURCE_API_URL=${REACT_APP_VIDEOSOURCE_API_URL} \
              --build-arg REACT_APP_OTP_LENGTH=${REACT_APP_OTP_LENGTH} \
              -f frontend/Dockerfile \
              -t ${DOCKERHUB_USERNAME}/movie-v2-fe:${CIRCLE_SHA1} \
              -t ${DOCKERHUB_USERNAME}/movie-v2-fe:latest \
              frontend

      - run:
          name: Login to Docker Hub
          command: |
            echo "${DOCKERHUB_ACCESS_TOKEN}" | docker login \
              -u "${DOCKERHUB_USERNAME}" \
              --password-stdin

      - run:
          name: Push Docker image
          command: |
            docker push ${DOCKERHUB_USERNAME}/movie-v2-fe:${CIRCLE_SHA1}
            docker push ${DOCKERHUB_USERNAME}/movie-v2-fe:latest

      - add_ssh_keys:
          fingerprints: "SHA256:iTOCamk8NuBTC+80zyasKwTAIdIXhJZEwydbVj2VEgA"

      - run:
          name: Deploy frontend to EC2
          command: |
            ssh -o StrictHostKeyChecking=no \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa \
              ${EC2_USER}@${EC2_HOST} "
                cd /home/ubuntu &&
                sed -i 's/^FRONTEND_TAG=.*/FRONTEND_TAG=${CIRCLE_SHA1}/' .env &&
                sudo docker compose pull frontend &&
                sudo docker compose up -d frontend &&
                sudo docker image prune -a -f
                sudo docker system prune -af
              "

workflows:
  build-and-deploy:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main
